[workspace]
members = ["crates/secondbrain-core", "crates/secondbrain-vault", "crates/secondbrain-markdown"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
crc32fast = "1.5.0"
criterion = "0.8.2"
loro = "1.13.7"
markdown = "1.0.0"
notify = "8.2.0"
proptest = "1.11.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = "1.1.3"
tracing = "0.1.44"
ulid = { version = "3.0.0", features = ["serde"] }
yrs = "0.27.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.test]
debug = 1
