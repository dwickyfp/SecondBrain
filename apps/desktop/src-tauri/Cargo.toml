[package]
name = "secondbrain-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"

[lib]
name = "secondbrain_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
secondbrain-core = { path = "../../../crates/secondbrain-core" }
secondbrain-index = { path = "../../../crates/secondbrain-index" }
secondbrain-vault = { path = "../../../crates/secondbrain-vault" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "=2.11.5"

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
