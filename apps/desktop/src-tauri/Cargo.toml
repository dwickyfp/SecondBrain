[package]
name = "secondbrain-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
default-run = "secondbrain-desktop"

[features]
benchmark-binaries = []

[[bin]]
name = "secondbrain-desktop"
path = "src/main.rs"

[[bin]]
name = "desktop-performance"
path = "src/bin/desktop-performance.rs"
required-features = ["benchmark-binaries"]

[[bin]]
name = "editor-gate-bench"
path = "src/bin/editor-gate-bench.rs"
required-features = ["benchmark-binaries"]

[lib]
name = "secondbrain_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
blake3 = "1.8.5"
secondbrain-core = { path = "../../../crates/secondbrain-core" }
secondbrain-diagnostics = { path = "../../../crates/secondbrain-diagnostics" }
secondbrain-index = { path = "../../../crates/secondbrain-index" }
secondbrain-markdown = { path = "../../../crates/secondbrain-markdown" }
secondbrain-transaction = { path = "../../../crates/secondbrain-transaction" }
secondbrain-vault = { path = "../../../crates/secondbrain-vault" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
