name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Platform contract tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          cargo test --locked -p secondbrain-vault --test platform -- --nocapture 2>&1 | tee "artifacts/platform-${{ runner.os }}.log"

      - name: Phase 0 e2e
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          cargo test --locked -p secondbrain-cli --test e2e_phase0 -- --nocapture 2>&1 | tee "artifacts/e2e-${{ runner.os }}.log"

      - name: Benchmark smoke request
        shell: bash
        run: |
          mkdir -p artifacts
          cargo run --locked -p crdt-comparison-bench -- smoke text 100 2 764230027 > "artifacts/benchmark-smoke-${{ runner.os }}.json"

      - name: Upload test and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: phase-0-${{ runner.os }}
          path: artifacts/
          if-no-files-found: warn

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policy
        run: cargo deny --locked check -D warnings
